name: Release

# Tag-driven version management. Pushing a `vX.Y.Z` tag validates that the tag
# matches the packaged version, verifies the release digest manifest against the
# tree, runs the test suite, and cuts a GitHub Release. This keeps the source of
# truth (src/azazel_fabric/version.py) and the GitHub Release in lockstep — see
# docs/migration-plan.md "Versioning and consumption policy".
#
# A `vX.Y.ZrcN` tag publishes as a GitHub *prerelease*. A candidate is pinnable
# but promises no stability, so it must not appear in the place a consumer looks
# for the latest stable release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pynacl
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import azazel_fabric; print(azazel_fabric.__version__)')"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package version $pkg"
            exit 1
          fi
      - name: Verify the release digest manifest matches the tree
        run: python tools/rc_digest.py --check "release/${GITHUB_REF_NAME}.digest.json"
      - name: Classify the tag
        id: classify
        run: |
          # Stable is exactly vMAJOR.MINOR.PATCH. Anything else — rc, a, b,
          # post, dev — is a prerelease. Allowlisting stable rather than
          # enumerating suffixes means an unforeseen suffix fails safe.
          if printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      # R1b is a *signed* candidate digest. A stable tag must carry a
      # signature the repository's trusted keys verify; a candidate may not
      # yet, because v0.9.0rc1 and rc2 were published before the signing
      # procedure existed and re-running their workflow must not now fail.
      # Either way the outcome is printed rather than left to be assumed.
      - name: Verify the detached release signature
        run: |
          manifest="release/${GITHUB_REF_NAME}.digest.json"
          if python tools/rc_signature.py "$manifest" --check; then
            exit 0
          fi
          if [ "${{ steps.classify.outputs.prerelease }}" = "false" ]; then
            echo "::error::A stable tag must carry a verified R1b signature."
            exit 1
          fi
          echo "::warning::${GITHUB_REF_NAME} is an unsigned candidate (R1b incomplete)."
      - name: Run tests
        run: pytest -q
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.classify.outputs.prerelease }}
