name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Full history and tags: tests/test_feature_minimums.py checks every
      # feature minimum against the release tags, and fails (rather than
      # skips) under CI when there are none to check against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PyNaCl is installed here, not declared in pyproject.toml. It is needed
      # only to verify R1b release signatures (tools/rc_signature.py), which
      # lives outside the installable surface the release digest covers, so a
      # consumer pinning the tag gets nothing extra. Without it the signature
      # guards would skip, and a skipped guard reports success.
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pynacl
      - name: Run tests
        run: pytest -q
